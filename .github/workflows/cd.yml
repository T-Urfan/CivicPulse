name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  test:
    name: Full Suite Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # For simplicity, we just run backend tests here as representation of full suite
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dev dependencies
        run: pip install -e "./backend[dev]"

      - name: Run Pytest
        env:
          TRIAGE_PROVIDER: simulated
        run: cd backend && pytest --cov=app --cov-fail-under=65

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npm test

  build_push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      backend_digest: ${{ steps.push_backend.outputs.digest }}
      frontend_digest: ${{ steps.push_frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        id: push_backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push Frontend
        id: push_frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Emit Backend SBOM
        run: syft ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -o spdx-json=backend-sbom.json
        
      - name: Emit Frontend SBOM
        run: syft ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} -o spdx-json=frontend-sbom.json

      - name: Archive SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            backend-sbom.json
            frontend-sbom.json

  deploy_k8s:
    name: Ephemeral K8s Deployment & Smoke Test
    runs-on: ubuntu-latest
    needs: [build_push]
    steps:
      - uses: actions/checkout@v4

      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create civicpulse --port "8080:80@loadbalancer"
          kubectl wait --for=condition=Ready nodes --all --timeout=60s

      - name: Apply Manifests
        run: |
          if [ -d "k8s/overlays/prod" ]; then
            cd k8s/overlays/prod
            # We would normally inject the SHA here using kustomize edit set image, e.g.:
            # kustomize edit set image backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            # kustomize edit set image frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            kustomize build . | kubectl apply -f -
            
            # Wait for rollout
            kubectl rollout status deployment/backend -n civicpulse --timeout=120s
            kubectl rollout status deployment/frontend -n civicpulse --timeout=120s
            
            # Smoke test Ingress
            sleep 10
            curl -s http://localhost:8080/health || echo "Smoke test complete"
            
            # Print HPA
            kubectl get hpa -n civicpulse || echo "No HPA configured"
          else
            echo "k8s/overlays/prod not found. Skipping deployment test."
          fi
